name: Link Checker
on:
  pull_request:
    branches:
      - main
      - LinkChecker
  push:
    branches:
      - main
      - LinkChecker
  schedule:
    # run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install linkchecker==10.2.1
          python -m pip install requests

      - name: check json file links
        run: |
          cd "$GITHUB_WORKSPACE/tests"
          python linkchecker.py "$GITHUB_WORKSPACE/data"

      - name: run linkchecker
        run: |
          cd "$GITHUB_WORKSPACE"
          nohup python -m http.server 8000 --bind 127.0.0.1 </dev/null >/tmp/jetsp_http.log 2>&1 &

          # Run LinkChecker, ignoring known external resources
          linkchecker --verbose --check-extern \
            --ignore-url 'https://www.googletagmanager.com/.*' \
            http://127.0.0.1:8000/nav.html
